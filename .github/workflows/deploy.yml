name: Verify SvelteKit build (Pages deployment unsupported)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-only:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SUPABASE_URL: https://example.supabase.co
      PUBLIC_SUPABASE_ANON_KEY: fake-ci-public-key
      GOOGLE_CLIENT_ID: fake-ci-client-id
      GOOGLE_CLIENT_SECRET: fake-ci-secret
      GOOGLE_REDIRECT_URI: http://localhost:3000/api/auth/callback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Explain deployment limitation
        run: echo "SvelteKit Google OAuth and database APIs require server-side hosting; GitHub Pages cannot run these routes. No deployment performed."
