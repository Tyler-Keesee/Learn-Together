name: Generate verified Tailwind lockfile (maintenance branch only)
on:
  push:
    branches:
      - maintenance/username-and-setup-20261114
    paths:
      - '.github/workflows/regen-lockfile.yml'
permissions:
  contents: write
jobs:
  lockfile:
    if: github.repository == 'Tyler-Keesee/Learn-Together'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate lockfile from the reviewed package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only the regenerated package lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(deps): lock Tailwind 4 PostCSS integration'
            git push origin HEAD:maintenance/username-and-setup-20261114
          fi
