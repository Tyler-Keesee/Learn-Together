name: Security invariants
on:
  pull_request:
    paths:
      - 'src/lib/server/migrationGuard.ts'
      - 'src/routes/api/migrate/**'
      - 'src/routes/api/supabase/migrate/**'
      - 'tests/**'
      - '.github/workflows/security.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/server/migrationGuard.ts'
      - 'src/routes/api/migrate/**'
      - 'src/routes/api/supabase/migrate/**'
      - 'tests/**'
      - '.github/workflows/security.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/security-routes.test.mjs
